name: Release notes (headless Claude)

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false     # 릴리스 작업에서는 캐시를 쓰지 않는다 (캐시 오염 방지)
      - run: npm install -g @anthropic-ai/claude-code@2.1.327   # 버전 고정
      - name: Summarize commits since previous tag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)
          git log --format='- %s (%h)' "${PREV}..${TAG}" > /tmp/commits.md
          claude -p "아래 커밋 목록으로 한국어 릴리스 노트를 작성하라. 기능/수정/CI 로 나누고 마크다운으로만 답하라.
          $(cat /tmp/commits.md)" \
            --output-format json --max-turns 1 --allowedTools "" > /tmp/out.json
          jq -e '.is_error == false' /tmp/out.json > /dev/null   # 인증·한도 오류면 실패 처리
          jq -r '.result' /tmp/out.json > /tmp/notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --notes-file /tmp/notes.md --verify-tag --title "$TAG"
