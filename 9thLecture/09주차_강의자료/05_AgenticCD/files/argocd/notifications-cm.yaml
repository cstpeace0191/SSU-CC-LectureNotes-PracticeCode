# Argo CD Notifications: 동기화 실패 → GitHub repository_dispatch → Claude sync incident 워크플로
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.webhook.github: |
    url: https://api.github.com
    headers:
      - name: Authorization
        value: Bearer $github-token          # argocd-notifications-secret 의 키
      - name: Accept
        value: application/vnd.github+json
  template.app-sync-failed: |
    webhook:
      github:
        method: POST
        path: /repos/cstpeace0191/todo-app-config/dispatches
        body: |
          {"event_type": "argocd-sync-failed",
           "client_payload": {"app": "{{.app.metadata.name}}",
                              "revision": "{{.app.status.sync.revision}}",
                              "phase": "{{.app.status.operationState.phase}}",
                              "message": {{toJson .app.status.operationState.message}}}}
  trigger.on-sync-failed: |
    - description: 동기화 실패
      send: [app-sync-failed]
      when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
  subscriptions: |
    - recipients: [github]
      triggers: [on-sync-failed]
