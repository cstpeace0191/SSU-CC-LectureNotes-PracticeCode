name: Claude CI Fix

on:  # zizmor: ignore[dangerous-triggers]  — 같은 저장소 PR 만, 아티팩트 미사용, head_sha 고정
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  fix:
    # 같은 저장소의 PR 브랜치에서 CI 가 실패했을 때만 (포크 PR · main 제외)
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'claude-fix/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Collect failed job logs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run view "$RUN_ID" --log-failed | tail -n 300 > /tmp/ci-failure.log
      - uses: anthropics/claude-code-action@v1
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /tmp/ci-failure.log 는 CI 실패 로그다. 원인을 찾아 최소한으로 수정하라.
            수정 후 backend 는 pytest · ruff, client 는 npm run lint · build 를 실행해 통과를 확인하라.
            브랜치 claude-fix/<원래 브랜치 이름> 으로 push 하고, 원래 브랜치($HEAD_BRANCH)를 base 로 PR 을 열어라.
            테스트를 지우거나 skip 처리해서 통과시키지 마라.
          claude_args: "--max-turns 25"
          settings: |
            {"permissions": {"allow": [
              "Read", "Edit", "Write", "Bash(pytest:*)", "Bash(ruff check:*)",
              "Bash(npm ci:*)", "Bash(npm run:*)", "Bash(git:*)", "Bash(gh pr create:*)"
            ]}}
