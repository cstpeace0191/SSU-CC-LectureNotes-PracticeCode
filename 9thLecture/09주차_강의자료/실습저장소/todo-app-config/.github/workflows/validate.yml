name: Validate manifests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        env: [dev, stg, prod]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install kustomize · kubeconform · kube-linter
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz" | tar xz -C "$HOME/bin"
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz -C "$HOME/bin" kubeconform
          curl -sSL https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz | tar xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: kustomize build
        run: kustomize build "overlays/${{ matrix.env }}" > rendered.yaml
      - name: kubeconform (스키마 검증)
        run: kubeconform -strict -summary -kubernetes-version 1.33.0 rendered.yaml
      - name: kube-linter (모범 사례 검사)
        run: kube-linter lint rendered.yaml --config .kube-linter.yaml
      - name: Diff summary
        run: |
          {
            echo "### ${{ matrix.env }} 렌더링 결과"
            echo '```'
            grep -E '^(kind|  name|  namespace)|image:' rendered.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
