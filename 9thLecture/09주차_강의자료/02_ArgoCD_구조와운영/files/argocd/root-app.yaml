# App of Apps: argocd/ 폴더(Project + ApplicationSet)를 Argo CD 가 스스로 관리
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cstpeace0191/todo-app-config.git
    targetRevision: main
    path: argocd
    directory:
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
