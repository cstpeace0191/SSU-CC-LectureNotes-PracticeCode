apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: todo-prod
resources:
  - ../../base
labels:
  - pairs:
      app.kubernetes.io/environment: prod
    includeSelectors: false
images:
  - name: ghcr.io/cstpeace0191/getting-started-todo-app-fastapi
    newTag: 539f79d78f6b574fae569dd4ad8c33a42f44a900
patches:
  - target:
      kind: Service
      name: todo-app
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
  - target:
      kind: Deployment
      name: todo-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
