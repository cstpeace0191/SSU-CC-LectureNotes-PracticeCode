name: Claude config review

on:
  pull_request:
    paths: ["base/**", "overlays/**", "argocd/**"]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Render base(main) vs head manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz" | tar xz -C "$HOME/bin"
          git worktree add /tmp/base "$BASE_SHA"
          for e in dev stg prod; do
            "$HOME/bin/kustomize" build "/tmp/base/overlays/$e" > "/tmp/base-$e.yaml"
            "$HOME/bin/kustomize" build "overlays/$e" > "/tmp/head-$e.yaml"
            diff -u "/tmp/base-$e.yaml" "/tmp/head-$e.yaml" > "/tmp/diff-$e.txt" || true
          done
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 PR 은 GitOps Config 저장소 변경이다. /tmp/diff-dev.txt, /tmp/diff-stg.txt, /tmp/diff-prod.txt 는
            병합 전후 kustomize 렌더링 결과의 차이다. 다음을 점검해 PR 에 한 개의 리뷰 코멘트로 남겨라.
            1) 바뀌는 환경과 리소스 요약  2) prod 영향 여부(이미지 태그가 stg 에서 검증된 SHA 인지)
            3) 보안 설정(runAsNonRoot, readOnlyRootFilesystem, resources) 약화 여부  4) 위험도: 낮음/중간/높음
            승인(approve)이나 병합은 하지 마라.
          claude_args: '--max-turns 8 --allowedTools "Read,Bash(cat:*),Bash(gh pr comment:*)"'
