###################################################
# This Compose file provides the production build environment for the todo app.
# 
# In this production configuration:
# 1. The backend image is built targeting the 'final' multi-stage Dockerfile stage,
#    which bundles the compiled React frontend static assets into the FastAPI server.
# 2. Traefik reverse proxy routes all incoming requests at localhost (port 80)
#    to the unified FastAPI backend (port 3000), which serves both the frontend SPA 
#    at '/' and the REST API at '/api/*'.
# 3. MySQL 9.3 persists todo items in the 'todo-mysql-data' volume.
# 4. phpMyAdmin and client-dev servers are excluded for production security and efficiency.
###################################################

services:

  ###################################################
  # Service: proxy
  #
  # Traefik v3 reverse proxy routing port 80 to the backend service.
  ###################################################
  proxy:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
    ports:
      - 80:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ###################################################
  # Service: backend
  #
  # Unified FastAPI backend that serves both static assets (React) and API endpoints.
  # Built with target: final from Dockerfile.
  ###################################################
  backend:
    build:
      context: ./
      target: final
    image: todo-app-fastapi:latest
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: secret
      MYSQL_DB: todos
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.backend.entrypoints: "web"
      traefik.http.routers.backend.rule: Host(`localhost`)
      traefik.http.services.backend.loadbalancer.server.port: 3000

  ###################################################
  # Service: mysql
  #
  # MySQL 9.3 database service with healthcheck and volume persistence.
  ###################################################
  mysql:
    image: mysql:9.3
    volumes:
      - todo-mysql-data:/var/lib/mysql
    environment: 
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: todos
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  ###################################################
  # Service: phpmyadmin
  #
  # Web interface to the MySQL database accessible at http://db.localhost.
  ###################################################
  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.phpmyadmin.entrypoints: "web"
      traefik.http.routers.phpmyadmin.rule: Host(`db.localhost`)
      traefik.http.services.phpmyadmin.loadbalancer.server.port: 80

###################################################
# Volumes
###################################################
volumes:
  todo-mysql-data:
