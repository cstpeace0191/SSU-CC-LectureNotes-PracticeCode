apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: todo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
            auto: true
          - env: stg
            auto: true
          - env: prod
            auto: false              # prod 는 수동 Sync (사람이 승인)
  template:
    metadata:
      name: "todo-{{.env}}"
      labels:
        env: "{{.env}}"
    spec:
      project: todo
      source:
        repoURL: https://github.com/cstpeace0191/todo-app-config.git
        targetRevision: main
        path: "overlays/{{.env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "todo-{{.env}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        retry:                       # 실패 시 재시도 횟수 제한 → 초과하면 phase=Failed (알림 트리거)
          limit: 2
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 1m
  templatePatch: |
    {{- if .auto }}
    spec:
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
    {{- end }}
