# ==========================================
# 1. MySQL PersistentVolumeClaim (데이터 영속화)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-mysql-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# ==========================================
# 2. MySQL Service (앱 전용 내부 통신용 - ClusterIP)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
# ==========================================
# 3. MySQL Deployment
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "secret"
            - name: MYSQL_DATABASE
              value: "todos"
          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: todo-mysql-data-pvc
---
# ==========================================
# 4. Getting-Started App Deployment
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: getting-started-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: getting-started-app
  template:
    metadata:
      labels:
        app: getting-started-app
    spec:
      containers:
        - name: getting-started
          image: getting-started
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_USER
              value: "root"
            - name: MYSQL_PASSWORD
              value: "secret"
            - name: MYSQL_DB
              value: "todos"
---
# ==========================================
# 5. Getting-Started App Service (외부 노출용 - NodePort)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: getting-started-service
spec:
  type: NodePort # 💡 외부 접근이 가능하도록 NodePort로 변경
  selector:
    app: getting-started-app
  ports:
    - port: 3000        # 클러스터 내부용 포트
      targetPort: 3000  # 파드 컨테이너 포트
      nodePort: 30000   # 💡 호스트/노드 외부에서 접근할 포트 (30000~32767 범위 지정 가능)