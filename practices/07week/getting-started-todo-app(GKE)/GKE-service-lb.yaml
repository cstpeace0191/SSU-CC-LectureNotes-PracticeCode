# GKE-service-lb.yaml : LoadBalancer Service (GCP 네트워크 로드밸런서로 외부 노출)
apiVersion: v1
kind: Service
metadata:
  name: todo-backend-lb
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: backend
  # [GKE 전용 참고]
  # - 기본 설정 시 GCP 외부 패스스루 네트워크 부하 분산기(External Passthrough Network Load Balancer)가 자동 생성됩니다.
  # - 만약 VPC 내부 전용 로드밸런서가 필요한 경우 아래 주석을 해제합니다:
  # annotations:
  #   networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  # 클라이언트 원본 IP 보존 및 불필요한 노드 간 네트워크 홉 방지 (GKE 권장)
  # → Pod 가 없는 노드는 LB 헬스체크에서 제외되어 트래픽을 받지 않음
  externalTrafficPolicy: Local
  selector:
    app: todo-backend        # Deployment 의 Pod 레이블과 일치해야 함
  ports:
    - name: http
      protocol: TCP
      port: 80               # GCP Load Balancer 외부 IP로 노출되는 포트 (http://<EXTERNAL-IP>)
      targetPort: 3000       # Pod 내부 백엔드 컨테이너 포트 (containerPort: 3000)

# 확인: kubectl get svc todo-backend-lb --watch   # EXTERNAL-IP 가 <pending> → 공인 IP 로 바뀔 때까지 대기
#       curl http://<EXTERNAL-IP>/
#
# [Kind vs GKE 차이점]
# - Kind: cloud-provider-kind 프로세스가 로컬에서 실행 중이어야 127.0.0.1 가상 외부 IP가 할당됨
# - GKE: 배포 즉시 Google Cloud가 실제 고유 공인 IP(External IP)를 자동 프로비저닝함
#
# [한계] L4 로드밸런서이므로 호스트/경로 라우팅·TLS 종료 없음, Service 마다 LB 1개(비용 증가)
#        → HTTPS·도메인·여러 서비스 통합이 필요하면 GKE Ingress(GKE-ingress.yaml) 사용
