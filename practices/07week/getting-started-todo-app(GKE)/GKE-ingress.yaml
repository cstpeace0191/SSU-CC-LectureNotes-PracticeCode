# GKE-ingress.yaml : GKE Ingress (외부 Application LB) + 관리형 인증서 + HTTPS 리다이렉트 + 헬스체크
#
# 사전 준비
#   1) 백엔드 Service 배포:  kubectl apply -f GKE-service-np.yaml      # todo-backend-np (port 80 → 3000)
#   2) 전역 고정 IP 예약 + DNS A 레코드 등록
#      gcloud compute addresses create todo-ip --global
#      gcloud compute addresses describe todo-ip --global --format="value(address)"
#      → www.ssu-cloud-computing-gke.com 의 A 레코드를 위 IP로 설정 (인증서 발급 조건)
#   3) 배포:  kubectl apply -f GKE-ingress.yaml
---
# ① TLS: Google 관리 인증서 (자동 발급·갱신, Secret 불필요)
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: todo-cert
spec:
  domains:
  - www.ssu-cloud-computing-gke.com      # Ingress rules.host 와 동일해야 함
---
# ② HTTP → HTTPS 리다이렉트 (nginx 의 ssl-redirect 에 해당하는 GKE 방식)
#    [주의] 실제 도메인 등록 사이트(DNS A 레코드)에 공인 IP를 등록하고 인증서가 Active 될 때까지는
#    로컬 hosts 파일 테스트를 위해 enabled: false 로 설정해야 브라우저 접속이 끊어지지 않습니다.
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: todo-fc
spec:
  redirectToHttps:
    enabled: false   # 로컬 hosts 테스트 시: false / 공인 도메인 DNS 등록 및 인증서 Active 완료 후: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT   # 301
  # sslPolicy: todo-ssl-policy                   # (선택) 사전 생성한 SSL 정책으로 TLS 버전 제한
---
# ③ 백엔드 헬스체크 (LB 가 Pod 상태를 판단) → todo-backend-np 의 annotation 으로 연결
#    기본 헬스체크는 "GET /" 가 200 을 반환해야 하므로, 앱의 실제 응답 경로를 지정
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: todo-backend-config
spec:
  healthCheck:
    type: HTTP
    requestPath: /api/items       # 200 을 반환하는 백엔드 경로 (앱에 맞게 조정)
    # port 생략: GKE 가 백엔드 방식(NEG → 3000, 인스턴스 그룹 → nodePort)에 맞게 자동 지정
    checkIntervalSec: 15
    timeoutSec: 5
---
# ④ Ingress: 호스트·경로 라우팅 + 고정 IP + TLS 종료
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-backend-ingress
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: backend
  annotations:
    # GKE Ingress 는 spec.ingressClassName 을 지원하지 않으므로 annotation 으로 지정
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "todo-ip"       # 사전 예약한 GCP 전역 고정 IP
    # [실습 모드: 공인 도메인/DNS 미보유 시 아래 두 줄 주석 유지]
    # networking.gke.io/managed-certificates: "todo-cert"         # ① Google 관리형 인증서 (FailedNotVisible 발생 시 비활성화)
    # networking.gke.io/v1beta1.FrontendConfig: "todo-fc"         # ② HTTPS 리다이렉트
spec:
  defaultBackend:                 # 어떤 규칙에도 맞지 않는 요청의 처리 대상
    service:
      name: todo-backend-np
      port:
        number: 80
  rules:
  - host: www.ssu-cloud-computing-gke.com   # 호스트 기반 라우팅 (todo-cert 도메인과 동일)
    http:
      paths:
      - path: /                   # 경로 기반 라우팅
        pathType: Prefix          # Prefix / Exact / ImplementationSpecific
        backend:
          service:
            name: todo-backend-np # GKE-service-np.yaml (NEG 사용 시 todo-backend-cip 도 가능)
            port:
              number: 80          # Service 의 port (targetPort 3000 아님)

# 확인: kubectl get ingress todo-backend-ingress            # ADDRESS = todo-ip 의 IP
#       kubectl describe ingress todo-backend-ingress       # backends 상태 HEALTHY 확인
#       kubectl describe managedcertificate todo-cert       # Status: Active 까지 수십 분 소요
#       curl -I http://www.ssu-cloud-computing-gke.com      # 301 → https
#       curl https://www.ssu-cloud-computing-gke.com/
