# GKE-service-np.yaml : NodePort Service (노드 포트로 외부 노출 + GKE Ingress 백엔드)
apiVersion: v1
kind: Service
metadata:
  name: todo-backend-np
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: backend
  annotations:
    # GKE Ingress(GKE-ingress.yaml) 의 헬스체크 설정(BackendConfig) 연결
    cloud.google.com/backend-config: '{"default": "todo-backend-config"}'
spec:
  type: NodePort
  selector:
    app: todo-backend        # Deployment 의 Pod 레이블과 일치해야 함
  ports:
    - name: http
      protocol: TCP
      port: 80               # 클러스터 내부의 다른 Pod나 서비스가 해당 Service(ClusterIP) 객체로 트래픽을 보낼 때 사용하는 포트
                             # (GKE Ingress 의 backend.service.port.number: 80 과 일치)
      targetPort: 3000       # container 실제 포트
      nodePort: 30080        # 외부에서 인식하는 노드(호스트 머신) IP 의 포트 (범위 30000-32767) - 방화벽에서 열어야 함

# [포트 3단계] 외부 <노드 외부IP>:30080 (nodePort) → Service:80 (port) → Pod:3000 (targetPort)
#
# GKE: GKE 노드의 외부 IP(External IP)로 직접 접근하려면 GCP 방화벽에서 30080 포트를 열어야 함:
#   $ gcloud compute firewall-rules create allow-gke-nodeport-30080 --allow tcp:30080 --target-tags <GKE-NODE-TAG>
#     태그를 생략할 수 있으며, 이 경우 VPC 의 모든 VM 노드에 대해 포트 30080 이 허용됨
#   $ kubectl get nodes -o wide           # EXTERNAL-IP 확인 → http://<노드 외부IP>:30080
#   * 비공개(private) 노드 클러스터는 노드 외부 IP 가 없으므로 이 방식으로 접근 불가
#   * 실무 GKE에서는 NodePort 직접 노출 대신 GKE Ingress(GKE-ingress.yaml) 또는 type: LoadBalancer(GKE-service-lb.yaml) 사용 권장
#   * GKE Ingress 를 통한 접근에는 위 방화벽 규칙이 필요 없음 (LB 헬스체크·프록시용 규칙은 GKE 가 자동 생성)
# - 외부 접속 테스트 시에는 kubectl port-forward 명령어를 활용할 수도 있습니다:
#   $ kubectl port-forward svc/todo-backend-np 8081:80   →  http://localhost:8081
