# sample-workloads.yaml
# nip.io 및 Gateway API 라우팅 테스트를 위한 샘플 백엔드 워크로드 (app, api)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: whereami
        image: us-docker.pkg.dev/google-samples/containers/gke/whereami:v1.2.20
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: default
  annotations:
    # GKE 컨테이너 네이티브 부하 분산 (NEG) 활성화
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: todo-backend           # 실제 Todo 백엔드 파드로 라우팅
  ports:
  - name: http
    port: 80
    targetPort: 3000            # Todo 백엔드 실제 포트 (3000)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-v1
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: whereami
        image: us-docker.pkg.dev/google-samples/containers/gke/whereami:v1.2.20
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
  annotations:
    # GKE 컨테이너 네이티브 부하 분산 (NEG) 활성화
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: ClusterIP
  selector:
    app: api-server
  ports:
  - name: http
    port: 80
    targetPort: 8080

