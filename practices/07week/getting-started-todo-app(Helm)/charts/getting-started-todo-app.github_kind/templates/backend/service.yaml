apiVersion: v1
kind: Service
metadata:
  annotations:
    katenary.v3/compose-hash: a54e0ec0f7e0833a19ef1a6aaab9019e82ab2f8a
    katenary.v3/version: master
  labels:
    {{- include "getting-started-todo-app.labels" . | nindent 4 }}
    katenary.v3/component: backend
  name: '{{ include "getting-started-todo-app.fullname" . }}-backend'
spec:
  type: {{ .Values.backend.serviceType | default "LoadBalancer" }}
  ports:
  - name: http
    port: {{ .Values.backend.servicePort | default 80 }}
    protocol: TCP
    targetPort: 3000
  selector:
    {{- include "getting-started-todo-app.selectorLabels" . | nindent 4 }}
    katenary.v3/component: backend
