apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: todo-gw
  namespace: infra
  annotations:        # Certificate Manager 인증서 맵
    networking.gke.io/certmap: todo-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:          # 사전 예약한 전역 고정 IP
  - type: NamedAddress
    value: todo-ip
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: www.ssu-cloud-computing-gke.com
    allowedRoutes:
      namespaces: {from: All}
  - name: http        # HTTP→HTTPS 리다이렉트용
    protocol: HTTP
    port: 80