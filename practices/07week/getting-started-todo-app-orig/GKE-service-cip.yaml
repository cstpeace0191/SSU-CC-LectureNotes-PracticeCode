# GKE-service-cip.yaml : ClusterIP Service (클러스터 내부 전용)
apiVersion: v1
kind: Service
metadata:
  name: todo-backend-cip
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP            # 생략 가능 (기본값)
  selector:
    app: todo-backend        # Deployment 의 Pod 레이블과 일치해야 함
  ports:
    - name: http
      protocol: TCP
      port: 80               # 클러스터 내부에서 Service 객체로 통신 시 사용 (가상 클러스터 IP 포트)
      targetPort: 3000       # container 실제 포트 (containerPort: 3000)

# [ClusterIP 특징]
# - 클러스터 내부 통신용 가상 IP를 할당받는 쿠버네티스의 기본 서비스 타입입니다.
# - 클러스터 외부에서는 직접 접근할 수 없으며, 클러스터 내부의 다른 파드나 서비스 간 통신에 사용됩니다.
# - DNS 자동 등록: todo-backend-cip.default.svc.cluster.local (같은 네임스페이스에서는 todo-backend-cip)
# - 외부 접속 테스트 시에는 kubectl port-forward 명령어를 활용할 수 있습니다:
#   $ kubectl port-forward svc/todo-backend-cip 8080:80   →  http://localhost:8080
# - GKE Ingress 백엔드: VPC 네이티브 클러스터에서 컨테이너 네이티브 LB(NEG)를 쓰면
#   ClusterIP 도 Ingress 백엔드로 사용 가능 (본 실습의 Ingress 는 todo-backend-np 사용)
