apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: todo-route
  namespace: default
spec:
  parentRefs:
  - name: todo-gw
    namespace: infra
    sectionName: https
  hostnames:
  - www.ssu-cloud-computing-gke.com
  rules:
  - matches:
    - path: {type: PathPrefix, value: /}
    backendRefs:
    - name: todo-backend-np
      port: 80
      weight: 90
    - name: todo-backend-v2   # 카나리 10%
      port: 80
      weight: 10