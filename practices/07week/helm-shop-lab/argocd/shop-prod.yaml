# [사례 7] 운영 환경 — CI(update-manifest)가 values-prod.yaml 의 image.tag 를 커밋하면 자동 반영
# 두 Application 의 동기화 순서는 보장되지 않는다. shop-api 의 PreSync 마이그레이션 Job 이
# DB 를 최대 60초 기다리고, 그래도 실패하면 syncPolicy.retry 로 다시 시도한다.
# 사전 준비: 운영 DB Secret 은 Git 에 두지 않고 직접(또는 External Secrets 로) 만든다
#   kubectl create ns shop-prod
#   kubectl -n shop-prod create secret generic shop-db-credentials \
#     --from-literal=username=shop --from-literal=password='<강한-비밀번호>'
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-db-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cstpeace0191/helm-shop-lab.git
    targetRevision: main
    path: charts/shop-db
    helm:
      valuesObject:
        auth:
          existingSecret: true
        persistence:
          size: 5Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-prod
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # 운영 DB 는 자동 삭제(prune) 금지
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/cstpeace0191/helm-shop-lab.git
    targetRevision: main
    path: charts/shop-api
    helm:
      releaseName: shop-api
      valueFiles: [values-prod.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    retry:
      limit: 3
      backoff: { duration: 20s, factor: 2, maxDuration: 3m }
