{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
  labels:
    {{- include "shop-db.labels" . | nindent 4 }}
  annotations:
    # helm uninstall 해도 Secret 은 남겨 두어 데이터와 비밀번호의 짝이 깨지지 않게 한다
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ required "auth.password 값이 필요합니다" .Values.auth.password | quote }}
{{- end }}
