# 운영 환경 — [사례 6] CI 가 image.tag 를 커밋 SHA 로 갱신 → [사례 7] Argo CD 가 동기화
replicaCount: 3

image:
  pullPolicy: IfNotPresent
  tag: "1.0.0"        # <- GitHub Actions(update-manifest 잡)가 자동으로 바꾸는 줄

config:
  greeting: "Hello from PROD"
  logLevel: warning

ingress:
  enabled: true
  className: traefik
  host: shop.example.com
  tls: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: shop-api
