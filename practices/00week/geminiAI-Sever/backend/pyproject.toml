[project]
name = "gemini-chat-backend"
version = "0.1.0"
description = "FastAPI Gemini AI Chat Server with Realtime Weather and Time Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv]
link-mode = "copy"
