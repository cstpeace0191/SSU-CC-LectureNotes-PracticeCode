name: Build and Push Docker Image

# main 브랜치에 push 이벤트가 발생할 때 실행됩니다.
on:
  push:
    branches:
      - main
  workflow_dispatch: # 👈 이 한 줄을 추가하면 GitHub 웹사이트에 수동 실행 버튼이 활성화됩니다!

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소의 소스 코드를 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Docker Buildx를 설정합니다. (빌드 속도 향상 및 멀티 플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Docker Hub에 로그인합니다. (GitHub Secrets 활용)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Docker 이미지를 빌드하고 Docker Hub에 Push합니다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Practices/getting-started-app
          file: ./Practices/getting-started-app/Dockerfile # Dockerfile 위치 (루트에 없다면 경로 수정 필요)
          push: true
          # 최신 버전(latest) 태그와 커밋 해시(${{ github.sha }}) 태그를 동시에 생성합니다.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcom:getting-started
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudcom:${{ github.sha }}