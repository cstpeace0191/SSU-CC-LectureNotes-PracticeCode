#//app.conf
# ① 전체를 환경 변수로
envFrom:
- configMapRef: { name: my-config }
 
# ② 특정 키만 환경 변수로
env:
- name: DB_HOST
  valueFrom:
    configMapKeyRef: { name: my-config, key: DB_HOST }
 
# ③ 파일로 마운트 (변경 시 자동 반영)
volumes:
- name: config-volume
  configMap: { name: app-conf }
containers:
- volumeMounts:
  - { name: config-volume, mountPath: /etc/app }
