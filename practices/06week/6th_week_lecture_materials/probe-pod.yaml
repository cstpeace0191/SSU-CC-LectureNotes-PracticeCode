# probe-pod.yaml
# 단일 Pod 실행을 위한 헬스 체크 매니페스트 (nginx:1.27)
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod
  namespace: default
  labels:
    app: nginx
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: "표준 nginx 이미지는 /var/cache 등 쓰기 권한이 필요함"
    ignore-check.kube-linter.io/run-as-non-root: "표준 nginx 이미지는 80 포트 바인딩 및 초기 구동 시 root 권한이 필요함"
spec:
  # [kube-linter 참고] 표준 nginx 이미지는 /var/cache, /var/run 쓰기 및 80 포트 바인딩이 필요하므로
  # 어노테이션으로 룰을 예외 처리하고 기본 root 실행을 허용합니다.
  containers:
  - name: nginx
    image: nginx:1.27

    ports:
    - containerPort: 80
      protocol: TCP
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 256Mi

    # ① startupProbe: Nginx 초기 구동 완료 확인
    startupProbe:
      httpGet:
        path: /
        port: 80
      failureThreshold: 30
      periodSeconds: 2

    # ② readinessProbe: 트래픽 수신 가능 상태 확인
    readinessProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 5

    # ③ livenessProbe: Nginx 프로세스 정상 여부 확인
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 10
  restartPolicy: Always
