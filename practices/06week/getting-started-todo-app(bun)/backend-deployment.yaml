apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Users\USER\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f compose.yaml
    kompose.version: 1.38.0 (a8f5d1cbd)
    traefik.http.routers.backend.rule: Host(`localhost`) && PathPrefix(`/api`)
    traefik.http.services.backend.loadbalancer.server.port: "3000"
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Users\USER\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f compose.yaml
        kompose.version: 1.38.0 (a8f5d1cbd)
        traefik.http.routers.backend.rule: Host(`localhost`) && PathPrefix(`/api`)
        traefik.http.services.backend.loadbalancer.server.port: "3000"
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: MYSQL_DB
              value: todos
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PASSWORD
              value: secret
            - name: MYSQL_USER
              value: root
          name: backend
          image: getting-started-todo-app-backend:latest
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
