apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: C:\Users\USER\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f compose.yaml
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: mysql
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mysql
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: C:\Users\USER\AppData\Local\Microsoft\WinGet\Links\kompose.exe convert -f compose.yaml
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: mysql
    spec:
      containers:
        - env:
            - name: MYSQL_DATABASE
              value: todos
            - name: MYSQL_ROOT_PASSWORD
              value: secret
          image: mysql:9.3
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          name: mysql
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: todo-mysql-data
      restartPolicy: Always
      volumes:
        - name: todo-mysql-data
          persistentVolumeClaim:
            claimName: todo-mysql-data
