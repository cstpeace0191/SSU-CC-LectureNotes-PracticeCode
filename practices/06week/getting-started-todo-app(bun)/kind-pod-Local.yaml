# [GKE 이미지 배포 시 주의사항]
# Kind에서는 'kind load docker-image todo-backend'로 로컬 이미지를 노드에 주입할 수 있었지만,
# 원격 클라우드인 GKE에서는 로컬 이미지(todo-backend)를 직접 접근할 수 없어 'ErrImagePull' 오류가 발생합니다.
#
# 따라서 GKE에서는 다음 2가지 방법 중 하나로 이미지를 제공해야 합니다:
#  방법 1 (Docker Hub): ssucloud/getting-started-todo-app:todo-backend
#  방법 2 (Google Artifact Registry): [REGION]-docker.pkg.dev/[PROJECT_ID]/[REPO]/todo-backend:prod
#
# 아래 매니페스트는 GCP 환경에서 권장하는 원격 레지스트리 경로 및 GKE CSI 스토리지를 적용한 버전입니다.

apiVersion: v1
kind: Secret
metadata:
  name: todo-db-secret
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/part-of: todo-app
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "secret"
  MYSQL_PASSWORD: "secret"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/part-of: todo-app
data:
  MYSQL_HOST: "mysql"
  MYSQL_USER: "root"
  MYSQL_DB: "todos"
  PORT: "3000"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-mysql-pvc
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard       # Kind 기본 스토리지 클래스 (rancher.io/local-path)
  resources:
    requests:
      storage: 1Gi                 # 로컬 실습용 크기

---
apiVersion: v1
kind: Pod
metadata:
  name: mysql
  labels:
    app: mysql
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  restartPolicy: Always
  containers:
    - name: mysql
      image: mysql:9.3
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3306
          name: mysql
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: MYSQL_DB
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      readinessProbe:
        exec:
          command:
            - mysqladmin
            - ping
            - -h
            - localhost
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command:
            - mysqladmin
            - ping
            - -h
            - localhost
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 3
  volumes:
    - name: mysql-data
      persistentVolumeClaim:
        claimName: todo-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql

---
apiVersion: v1
kind: Pod
metadata:
  name: todo-backend
  labels:
    app: todo-backend
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: backend
spec:
  restartPolicy: Always
  initContainers:
    - name: wait-for-mysql
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          echo "Waiting for MySQL service at mysql:3306..."
          until nc -z -v -w3 mysql 3306; do
            echo "MySQL is not ready yet, sleeping 2s..."
            sleep 2
          done
          echo "MySQL is available!"
  containers:
    - name: backend
      # GKE는 원격 환경이므로 로컬 태그(todo-backend) 대신 공인 레지스트리 경로 지정 필수
      image: todo-backend:prod
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3000
          name: http
      envFrom:
        - configMapRef:
            name: todo-config
        - secretRef:
            name: todo-db-secret
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "300m"
          memory: "256Mi"
      readinessProbe:
        httpGet:
          path: /api/items
          port: 3000
        initialDelaySeconds: 5
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /api/items
          port: 3000
        initialDelaySeconds: 15
        periodSeconds: 10
