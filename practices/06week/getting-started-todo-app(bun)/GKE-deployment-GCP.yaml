################################################################################
# [GKE 프로덕션 환경에서 Traefik(리버스 프록시)이 필요 없는 이유]
#
# 1. 프론트엔드/백엔드 단일 컨테이너 번들링:
#    - Docker Compose 개발 환경에서는 client(React Dev 서버)와 backend가 분리되어
#      단일 진입점(포트 80)에서 경로(/api vs /)별로 요청을 라우팅할 Traefik이 필요했습니다.
#    - 반면 GKE 프로덕션에서는 Dockerfile(target: final)을 통해 프론트엔드 정적 파일이
#      Express 백엔드(todo-backend:prod, 포트 3000) 내부에 완전 통합 번들링되어
#      직접 서빙되므로 컨테이너 간 경로 분기 프록시가 필요 없습니다.
#
# 2. 쿠버네티스 네이티브 DNS & Service(L4) 지원:
#    - 백엔드 Pod에서 DB로 접근할 때 별도 프록시 없이, 쿠버네티스 내장 Service(mysql)와
#      CoreDNS에 의해 'mysql:3306' 이름으로 자동 서비스 디스커버리 및 내부 부하 분산이 처리됩니다.
#
# 3. 클라우드 관리형 로드 밸런서(GCP Cloud Load Balancer) 활용:
#    - 외부 클라이언트의 접속(80 포트)은 'GKE-service-lb.yaml'(type: LoadBalancer) 또는
#      'GKE-ingress.yaml'을 통해 GCP 자체 L4/L7 네트워크 부하 분산기가 외부 공인 IP를
#      자동 프로비저닝하므로 클러스터 내부에 별도의 Traefik 소프트웨어 프록시가 불필요합니다.
#
# 4. 아키텍처 및 보안 (Docker Socket 비사용):
#    - Compose의 Traefik은 호스트의 Docker 소켓(/var/run/docker.sock)을 마운트하여 라벨을 감시하지만,
#      GKE(containerd 런타임)와 같은 프로덕션 쿠버네티스에서는 호스트 소켓 마운트가 심각한
#      보안 취약점이 되므로 쿠버네티스 표준 API(Service, Ingress)로 트래픽을 제어합니다.
################################################################################

apiVersion: v1
kind: Secret
metadata:
  name: todo-db-secret
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/part-of: todo-app
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "secret"
  MYSQL_PASSWORD: "secret"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/part-of: todo-app
data:
  MYSQL_HOST: "mysql"
  MYSQL_USER: "root"
  MYSQL_DB: "todos"
  PORT: "3000"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-mysql-pvc
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo   # GKE 기본 CSI 스토리지 클래스 (pd-balanced)
  resources:
    requests:
      storage: 10Gi                # GCP Persistent Disk 최소 지원 크기 (10Gi)

---
apiVersion: v1
kind: Pod
metadata:
  name: mysql
  labels:
    app: mysql
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  restartPolicy: Always
  containers:
    - name: mysql
      image: mysql:9.3
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3306
          name: mysql
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: MYSQL_DB
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      readinessProbe:
        exec:
          command:
            - mysqladmin
            - ping
            - -h
            - localhost
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command:
            - mysqladmin
            - ping
            - -h
            - localhost
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 3
  volumes:
    - name: mysql-data
      persistentVolumeClaim:
        claimName: todo-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  # [GKE 무중단 롤링 업데이트 전략]
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
        app.kubernetes.io/name: getting-started-todo-app
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL service at mysql:3306..."
              until nc -z -v -w3 mysql 3306; do
                echo "MySQL is not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "MySQL is available!"
      containers:
        - name: backend
          # GKE Artifact Registry 전용 프로덕션 이미지
          image: asia-northeast3-docker.pkg.dev/ssu-agent-vertex-509708/my-repo/todo-backend:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-db-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/items
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/items
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
