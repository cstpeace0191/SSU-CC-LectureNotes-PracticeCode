# ==============================================================================
# CI — PR마다 lint + test
#
# App 저장소의 품질 게이트입니다. 클라우드 권한 없이 코드만 검증합니다.
#   - backend: ruff(lint) + pytest (Python 3.12, Dockerfile과 동일 버전)
#   - client : eslint(lint) + vite build (Node 22, Dockerfile과 동일 버전)
# 브랜치 보호 규칙에서 "backend", "client" 두 체크를 필수(required)로 지정하세요.
# ==============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN은 코드 읽기만 허용 (최소 권한)
permissions:
  contents: read

# 같은 브랜치/PR에서 새 커밋이 오면 이전 실행을 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.8.6

      - name: Lint (ruff)
        run: ruff check . --output-format github

      - name: Test (pytest)
        # pytest.ini: testpaths=spec, asyncio_mode=auto
        run: pytest -q

  client:
    name: client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        # lockfile 그대로 설치, 설치 스크립트 실행 금지 (공급망 보안)
        run: npm ci --ignore-scripts

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (vite)
        # vite build 후 copy-build.js가 dist를 backend/src/static으로 복사
        run: npm run build
