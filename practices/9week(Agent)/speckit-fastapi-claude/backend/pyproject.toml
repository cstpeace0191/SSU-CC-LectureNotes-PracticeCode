[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Ruff (ci.yml의 lint 단계에서 사용)
[tool.ruff]
target-version = "py312"   # Dockerfile의 python:3.12-slim과 맞춤
extend-exclude = [".venv", "src/static"]

[tool.ruff.lint.per-file-ignores]
# main.py는 uvicorn 진입점으로 app을 다시 내보낸다 (re-export)
"main.py" = ["F401"]
# MIME 타입 등록(mimetypes.add_type)이 앱 모듈 import보다 먼저 실행되어야 한다
"src/main.py" = ["E402"]
# 테스트는 patch(...) as mock_x 형태로 사용하지 않는 mock 이름을 둔다
"spec/**" = ["F841"]
